[Service]
# Run CamillaDSP at real-time priority so CPU spikes (e.g. CarPlay video
# decoding) can't cause playback underruns / clicks. 70 is just below
# PipeWire's own data loop (83); the kernel's RT throttling still keeps
# 5% of CPU for everything else.
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=70
LimitRTPRIO=95
LimitMEMLOCK=infinity
