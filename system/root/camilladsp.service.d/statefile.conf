[Service]
# Active config comes from the statefile (shared with the web GUI and the
# dashboard's Audio page), so switching configs survives a reboot.
# -g-40 still forces a safe startup volume.
ExecStart=
ExecStart=/usr/local/bin/camilladsp -l info -a 0.0.0.0 -p 1234 -g-40 -s /home/pi/CamillaDSP/statefile.yml
