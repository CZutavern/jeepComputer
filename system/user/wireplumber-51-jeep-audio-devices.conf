# Jeep Computer audio devices
#
# - The HiFiBerry DAC8x belongs to CamillaDSP (it opens hw:sndrpihifiberry
#   directly). If WirePlumber ever opened it first, CamillaDSP would fail
#   with "device busy" and there'd be no sound, so PipeWire ignores it.
# - HDMI audio is disabled so nothing can fall back to playing through the
#   screen; all audio goes to the jeep_carplay / jeep_music sinks.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-soc_107c000000_sound" }
      { device.name = "alsa_card.platform-107c701400.hdmi" }
      { device.name = "alsa_card.platform-107c706400.hdmi" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
