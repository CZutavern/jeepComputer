title: Jeep 3-Way LR4
description: '6.1: PRO-X6BM front + rear (out 1-4) above 300 Hz, 8in center mid-bass
  at the 2nd row (out 5-6) 80-300 Hz, Sundown 12in subs as one mono bass channel (out
  7-8) below 80 Hz. Linkwitz-Riley 24 dB/oct, per-output trim + delay.'
