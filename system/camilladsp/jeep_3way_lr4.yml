filters:
  safety_limiter:
    type: Limiter
    description: Soft clip just below full scale to protect against hard digital clipping
    parameters:
      soft_clip: true
      clip_limit: -1.0
  trim_8:
    type: Gain
    description: Sub 2 level trim
    parameters:
      gain: 0.0
      inverted: false
      mute: false
      scale: dB
  mid_highpass:
    type: BiquadCombo
    description: 'PRO-X6BM front + rear: keep out of the bass, try 250-350 Hz by ear'
    parameters:
      type: LinkwitzRileyHighpass
      freq: 300.0
      order: 4
  delay_4:
    type: Delay
    description: Rear R time alignment
    parameters:
      delay: 0.0
      unit: ms
      subsample: false
  delay_1:
    type: Delay
    description: Front L time alignment (rough estimate for a 1975 Cherokee; delays
      align every speaker to the driver's seat)
    parameters:
      delay: 4.1
      unit: ms
      subsample: false
  trim_6:
    type: Gain
    description: 8in R level trim
    parameters:
      gain: 0.0
      inverted: false
      mute: false
      scale: dB
  trim_4:
    type: Gain
    description: Rear R level trim
    parameters:
      gain: 0.0
      inverted: false
      mute: false
      scale: dB
  delay_6:
    type: Delay
    description: 8in R time alignment
    parameters:
      delay: 2.5
      unit: ms
      subsample: false
  trim_5:
    type: Gain
    description: 8in L level trim
    parameters:
      gain: 0.0
      inverted: false
      mute: false
      scale: dB
  delay_2:
    type: Delay
    description: Front R time alignment
    parameters:
      delay: 2.7
      unit: ms
      subsample: false
  midbass_highpass:
    type: BiquadCombo
    description: '8in center mid-bass: hand-off from the subs'
    parameters:
      type: LinkwitzRileyHighpass
      freq: 80.0
      order: 4
  midbass_lowpass:
    type: BiquadCombo
    description: '8in center mid-bass: hand-off to the front/rear mids'
    parameters:
      type: LinkwitzRileyLowpass
      freq: 300.0
      order: 4
  delay_5:
    type: Delay
    description: 8in L time alignment
    parameters:
      delay: 3.85
      unit: ms
      subsample: false
  sub_subsonic:
    type: BiquadCombo
    description: Protects the woofers from excursion below tuning
    parameters:
      type: ButterworthHighpass
      freq: 25.0
      order: 4
  delay_3:
    type: Delay
    description: Rear L time alignment
    parameters:
      delay: 0.75
      unit: ms
      subsample: false
  trim_1:
    type: Gain
    description: Front L level trim
    parameters:
      gain: 0.0
      inverted: false
      mute: false
      scale: dB
  sub_lowpass:
    type: BiquadCombo
    description: 'Subs: hand-off to the mid-bass'
    parameters:
      type: LinkwitzRileyLowpass
      freq: 80.0
      order: 4
  trim_2:
    type: Gain
    description: Front R level trim
    parameters:
      gain: 0.0
      inverted: false
      mute: false
      scale: dB
  delay_8:
    type: Delay
    description: Sub 2 time alignment
    parameters:
      delay: 0.25
      unit: ms
      subsample: false
  trim_3:
    type: Gain
    description: Rear L level trim
    parameters:
      gain: 0.0
      inverted: false
      mute: false
      scale: dB
  loudness:
    type: Loudness
    description: More bass/treble at low volume (turn on with BYPASS)
    parameters:
      reference_level: -25.0
      high_boost: 0.0
      low_boost: 7.0
      fader: Main
      attenuate_mid: false
  delay_7:
    type: Delay
    description: Sub 1 time alignment
    parameters:
      delay: 0.4
      unit: ms
      subsample: false
  trim_7:
    type: Gain
    description: Sub 1 level trim
    parameters:
      gain: 0.0
      inverted: false
      mute: false
      scale: dB
processors: null
